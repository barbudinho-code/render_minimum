<!DOCTYPE html>
<html lang="pt-BR" class="lang-pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Candidatos</title>
    <link rel="icon" href="/static/icon.ico"/>

    <!-- Sistema de Internacionalização (i18n) -->
    <script src="/static/i18n.js"></script>

    <style>        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #333; font-size: 2em; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 1.1em; }

        .hierarchy-container {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .hierarchy-title {
            font-size: 1.3em;
            color: #444;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .level {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            transition: all 0.3s ease;
            position: relative;
        }

        .level-active { display: inline-flex; }
        .level-hidden { display: none; }

        .level:first-child { border-left: 4px solid #667eea; }
        .level:nth-child(2) { border-left: 4px solid #764ba2; }
        .level:nth-child(3) { border-left: 4px solid #f093fb; }
        .level:nth-child(4) { border-left: 4px solid #ff6b95; }

        .level label {
            font-weight: 600;
            color: #555;
            margin-right: 8px;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            color: #333;
            cursor: pointer;
            min-width: 150px;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-section {
            background: linear-gradient(135deg, #fff9c4, #ffecb3);
            border-radius: 15px;
            padding: 25px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .info-card h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .info-card p, .info-card span {
            color: #555;
            line-height: 1.6;
        }

        .breadcrumb {
            display: flex;
            gap: 5px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            color: #666;
        }

        .version-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.85em;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .level { min-width: auto; flex-direction: column; align-items: stretch; width: 100%; }
            select { width: 100%; min-width: auto; }
            h1 { font-size: 1.5em; }
        }

        /* Language-specific styles */
        .lang-en-US h1, .lang-en-US .subtitle { direction: ltr; }
        .lang-es-ES p, .lang-es-MX p { font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="page-title" data-i18n="title"></h1>
            <p class="subtitle" id="page-subtitle" data-i18n="subtitle"></p>
        </header>

        <div class="hierarchy-container">
            <div class="hierarchy-title" data-i18n="hierarchyTitle"></div>

            <!-- Nível 1: País -->
            <div class="level level-active" id="level-0">
                <label for="pais-select" data-i18n="countryLabel"></label>
                <select id="pais-select">
                    <option value="">Selecione um país...</option>
                </select>
            </div>

            <!-- Nível 2: Partido -->
            <div class="level level-hidden" id="level-1">
                <label for="partido-select" data-i18n="partyLabel"></label>
                <select id="partido-select">
                    <option value="">Selecione um partido...</option>
                </select>
            </div>

            <!-- Nível 3: Cargo -->
            <div class="level level-hidden" id="level-2">
                <label for="cargo-select" data-i18n="positionLabel"></label>
                <select id="cargo-select">
                    <option value="">Selecione uma posição...</option>
                </select>
            </div>

            <!-- Nível 4: Candidato -->
            <div class="level level-hidden" id="level-3">
                <label for="candidato-select" data-i18n="candidateLabel"></label>
                <select id="candidato-select">
                    <option value="">Selecione um candidato...</option>
                </select>
            </div>

            <!-- Breadcrumb -->
            <div class="breadcrumb" id="breadcrumb"></div>
        </div>

        <!-- Seção de Informações do Candidato -->
        <div class="info-section" id="info-section">
            <h2 style="color:#333;margin-bottom:15px;" data-i18n="infoTitle"></h2>
            <div class="info-grid">
                <div class="info-card">
                    <h4 data-i18n="nameField"></h4>
                    <span id="info-nome"></span>
                </div>
                <div class="info-card">
                    <h4 data-i18n="ageField"></h4>
                    <span id="info-idade"></span>
                </div>
                <div class="info-card">
                    <h4 data-i18n="nationalityField"></h4>
                    <span id="info-nacionalidade"></span>
                </div>
            </div>
            <div class="info-card" style="margin-top: 20px;">
                <h4 data-i18n="bioField"></h4>
                <p id="info-biografia" style="white-space: pre-wrap; line-height: 1.8;"></p>
            </div>

            <p style="margin-top: 20px; color: #666;" data-i18n="dateField"></p>
        </div>

        <!-- Estado vazio inicial -->
        <div class="empty-state" id="empty-state">
            <p data-i18n="emptyState.title"></p>
            <p style="margin-top: 10px;" data-i18n="emptyState.subtitle"></p>
        </div>

        <div class="version-badge">Versão: 1.0.4</div>
    </div>

    <script>
        // Elementos do DOM
        const selectores = {
            pais: document.getElementById('pais-select'),
            partido: document.getElementById('partido-select'),
            cargo: document.getElementById('cargo-select'),
            candidato: document.getElementById('candidato-select')
        };

        const infoSection = document.getElementById('info-section');
        const emptyState = document.getElementById('empty-state');
        const breadcrumb = document.getElementById('breadcrumb');

        // Dicionário de localização de países -> locale (formato para API: pt-BR, en-US, es-ES)
        const LOCALE_MAP = {
            1: 'pt-BR',     // Brasil
            2: 'en-US',     // Portugal
            3: 'es-ES',     // Espanha
            4: 'es-MX',     // Argentina
            5: 'es-MX'      // México
        };

        // Função para aplicar tradução de idioma
        function atualizarIdioma(locale) {
            console.log('Mudando idioma para:', locale);

            // Muda o lang do HTML
            document.documentElement.lang = locale.split('-')[0];
            console.log('HTML lang mudado para:', document.documentElement.lang);

            // Atualiza textos baseado no locale
            const trad = {
                'pt-BR': { title: 'Sistema de Candidatos', hierarchyTitle: '📊 Hierarquia de Seleção' },
                'en-US': { title: 'Candidate System', hierarchyTitle: '📊 Selection Hierarchy' },
                'es-ES': { title: 'Sistema de Candidatos', hierarchyTitle: '📊 Jerarquía de Selección' }
            };

            const t = trad[locale] || trad['pt-BR'];

            // Atualiza títulos
            if (document.getElementById('page-title')) {
                document.getElementById('page-title').textContent = t.title;
            }

            if (document.querySelector('[data-i18n="hierarchyTitle"]')) {
                document.querySelector('[data-i18n="hierarchyTitle"]').textContent = t.hierarchyTitle;
            }

            // Garante que o nível de partidos esteja VISÍVEL após mudar idioma
            const levelPartido = document.getElementById('level-1');
            if (levelPartido) {
                console.log('Nível de partidos (level-1) classes:', Array.from(levelPartido.classList));
                // Remove level-hidden e adiciona level-active
                levelPartido.classList.remove('level-hidden');
                levelPartido.classList.add('level-active');
                console.log('Nível de partidos agora visível, aguardando loadParties() para preencher');
            }

        }

        // Carrega países ao iniciar
        async function loadCountries() {
            try {
                const res = await fetch('/api/carrega_paises');
                const paises = await res.json();

                selectores.pais.innerHTML = '<option value="">Selecione um país...</option>' +
                    paises.map(p => `<option value="${p.id}" data-locale="${LOCALE_MAP[p.id]}">
                        ${p.nome}
                    </option>`).join('');
            } catch (err) {
                console.error('Erro ao carregar países:', err);
            }
        }

        // Função para ocultar todos os dropdowns inferiormente na hierarquia
        function ocultarDropdownsInferiores() {
            // Oculta e limpa dropdown de partido
            const levelPartido = document.getElementById('level-1');
            if (levelPartido) {
                levelPartido.classList.add('level-hidden');
                selectores.partido.innerHTML = '<option value="">Selecione um partido...</option>';
            }

            // Oculta e limpa dropdown de cargo
            const levelCargo = document.getElementById('level-2');
            if (levelCargo) {
                levelCargo.classList.add('level-hidden');
                selectores.cargo.innerHTML = '<option value="">Selecione uma posição...</option>';
            }

            // Oculta e limpa dropdown de candidato
            const levelCandidato = document.getElementById('level-3');
            if (levelCandidato) {
                levelCandidato.classList.add('level-hidden');
                selectores.candidato.innerHTML = '<option value="">Selecione um candidato...</option>';
            }

            console.log('Dropdowns inferiores ocultos e limpos');
        }

        // Carrega cargos para um partido
        async function loadParties() {
            const paisId = selectores.pais.value;
            if (!paisId) return;

            try {
                const res = await fetch(`/api/carrega_partidos/${paisId}`);
                const partidos = await res.json();

                // Limpa e oculta dropdowns inferiores
                ocultarDropdownsInferiores();

                selectores.partido.innerHTML = '<option value="">Selecione um partido...</option>' +
                    partidos.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');

                // Armazena no cache
                window.partidosCache.set(paisId, partidos);
            } catch (err) {
                console.error('Erro ao carregar partidos:', err);
            }
        }

        // Carrega cargos para um partido
        async function loadCargos() {
            const paisId = selectores.pais.value;
            const partidoId = selectores.partido.value;

            if (!paisId || !partidoId) return ocultarDropdownsInferiores();

            try {
                const res = await fetch(`/api/carrega_cargos/${paisId}/${partidoId}`);
                const cargos = await res.json();

                selectores.partido.innerHTML = '<option value="">Selecione um partido...</option>';
                ocultarDropdownsInferiores();

                selectores.cargo.innerHTML = '<option value="">Selecione uma posição...</option>' +
                    cargos.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');

                window.cargosCache.set(`${paisId}-${partidoId}`, cargos);
            } catch (err) {
                console.error('Erro ao carregar cargos:', err);
            }
        }

        // Carrega candidatos para um cargo
        async function loadCandidatos() {
            const paisId = selectores.pais.value;
            const partidoId = selectores.partido.value;
            const cargoId = selectores.cargo.value;

            if (!paisId || !partidoId || !cargoId) return;

            try {
                const res = await fetch(`/api/carrega_candidatos/${paisId}/${partidoId}/${cargoId}`);
                const candidatos = await res.json();

                selectores.candidato.innerHTML = '<option value="">Selecione um candidato...</option>' +
                    candidatos.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');

                window.candidatosCache.set(`${paisId}-${partidoId}-${cargoId}`, candidatos);
            } catch (err) {
                console.error('Erro ao carregar candidatos:', err);
            }
        }

        // Carrega informações do candidato
        async function loadInfo() {
            const paisId = selectores.pais.value;
            const partidoId = selectores.partido.value;
            const cargoId = selectores.cargo.value;
            const candidatoId = selectores.candidato.value;

            if (!paisId || !partidoId || !cargoId || !candidatoId) return;

            try {
                const res = await fetch(`/api/carrega_info/${paisId}/${partidoId}/${cargoId}/${candidatoId}`);
                const info = await res.json();

                // Atualiza as informações no DOM
                document.getElementById('info-nome').textContent = info.nome;
                document.getElementById('info-idade').textContent = info.idade;
                document.getElementById('info-nacionalidade').textContent = info.nacionalidade;
                document.getElementById('info-biografia').textContent = info.biografia;

                // Atualiza breadcrumb com os dados carregados
                updateBreadcrumb(info);

                // Mostra a seção de informações e esconde o estado vazio
                infoSection.style.display = 'block';
                emptyState.style.display = 'none';

                window.infoCache.set(`${paisId}-${partidoId}-${cargoId}-${candidatoId}`, info);
            } catch (err) {
                console.error('Erro ao carregar info:', err);
            }
        }

        // Atualiza breadcrumb
        function updateBreadcrumb(info) {
            let html = '';

            if (info.pais) {
                html += `<span class="breadcrumb-item">🌍 ${info.pais}</span>`;
            }
            if (info.partido) {
                html += `<span style="margin: 0 5px;">→</span>
                        <span class="breadcrumb-item" style="color:#764ba2;font-weight:600">🎭 ${info.partido}</span>`;
            }
            if (info.cargo) {
                html += `<span style="margin: 0 5px;">→</span>
                        <span class="breadcrumb-item" style="color:#f093fb">💼 ${info.cargo}</span>`;
            }
            if (info.nome) {
                const nomeShort = info.nome.split(' ').slice(0, 2).join(' ');
                html += `<span style="margin: 0 5px;">→</span>
                        <span class="breadcrumb-item" style="color:#ff6b95;font-weight:bold;font-size:0.9em">👤 ${nomeShort}</span>`;
            }

            breadcrumb.innerHTML = html;
        }

        // Event listeners para recarregar dados quando mudar de nível hierárquico
        selectores.pais.addEventListener('change', function() {
            console.log('País selecionado:', this.value);

            if (this.value) {
                const selectedOption = this.options[this.selectedIndex];
                const locale = selectedOption.getAttribute('data-locale');

                // Muda o idioma antes de carregar partidos
                atualizarIdioma(locale);

                // Carrega partidos
                loadParties();
            } else {
                console.log('Nenhum país selecionado, resetando');
                ocultarDropdownsInferiores();
            }

            atualizarBreadcrumb();
        });

        selectores.partido.addEventListener('change', function() {
            loadCargos();
            atualizarBreadcrumb();

            // Se não tem valor, oculta tudo
            if (!this.value) {
                ocultarDropdownsInferiores();
            } else {
                // Tenta mostrar o nível de cargo se existir
                const levelCargo = document.getElementById('level-2');
                if (levelCargo && !levelCargo.classList.contains('level-hidden')) {
                    levelCargo.classList.add('level-active');
                }
            }
        });

        selectores.cargo.addEventListener('change', function() {
            loadCandidatos();
            atualizarBreadcrumb();

            // Se não tem valor, oculta tudo
            if (!this.value) {
                ocultarDropdownsInferiores();
            } else {
                // Tenta mostrar o nível de candidato se existir
                const levelCandidato = document.getElementById('level-3');
                if (levelCandidato && !levelCandidato.classList.contains('level-hidden')) {
                    levelCandidato.classList.add('level-active');
                }
            }
        });

        selectores.candidato.addEventListener('change', function() {
            loadInfo();
            console.log('Candidato selecionado, carregando informações...');

            // Tenta mostrar o nível de candidato se existir
            const levelCandidato = document.getElementById('level-3');
            if (levelCandidato && !levelCandidato.classList.contains('level-hidden')) {
                levelCandidato.classList.add('level-active');
            }
        });

        // Atualiza breadcrumb ao carregar países
        function atualizarBreadcrumb() {
            const pais = selectores.pais.options[selectores.pais.selectedIndex]?.text;
            const partido = selectores.partido.options[selectores.partido.selectedIndex]?.text;
            const cargo = selectores.cargo.options[selectores.cargo.selectedIndex]?.text;
            const candidato = selectores.candidato.options[selectores.candidato.selectedIndex]?.text;

            let html = '';

            if (pais) {
                html += `<span class="breadcrumb-item">🌍 ${pais}</span>`;
            }
            if (partido) {
                html += `<span style="margin: 0 5px;">→</span>
                        <span class="breadcrumb-item" style="color:#764ba2;font-weight:600">🎭 ${partido}</span>`;
            }
            if (cargo) {
                html += `<span style="margin: 0 5px;">→</span>
                        <span class="breadcrumb-item" style="color:#f093fb">💼 ${cargo}</span>`;
            }
            if (candidato) {
                html += `<span style="margin: 0 5px;">→</span>
                        <span class="breadcrumb-item" style="color:#ff6b95;font-weight:bold;font-size:0.9em">👤 ${candidato}</span>`;
            }

            breadcrumb.innerHTML = html;
        }

        // Inicializa
        loadCountries();
    </script>
</body>
</html>
