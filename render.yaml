services:
  - type: web
    name: hello-world-app
    env: python
    # Build command para instalar dependências Flask e Gunicorn
    build_cmd: |
      pip install flask gunicorn > /dev/null 2>&1

    # Comando de run usando Gunicorn no porta $PORT
    run: gunicorn --bind 0.0.0.0:${PORT} app:app

    # Configurações básicas para produção no Render
    disk: 512
    memory: 512
